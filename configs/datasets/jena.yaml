# Frozen hourly Jena protocol. Experiment runners read configs/jena.yaml.
# Do not edit this file to chase model performance.
dataset:
  key: jena_frozen_v1
  frozen_config: configs/datasets/jena_frozen.yaml
  prepared_path: data/processed/jena_hourly.csv
  source_manifest: data/manifests/jena_sources.csv
  temporal_resolution: hourly
  target_column: "T (degC)"
  feature_columns: ["T (degC)", "p (mbar)", "rh (%)", "wv (m/s)"]
window:
  history: 168
  horizons: [1, 6, 24]
split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15
