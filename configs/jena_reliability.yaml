experiment:
  name: jena_reliability_full

dataset:
  panel_config: configs/datasets/jena_frozen.yaml
  prepared_dir: results/prepared/jena_frozen_v1
  frequency: 1h

window:
  history: 168
  horizons: [1, 6, 24]

split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15

training:
  seeds: [11, 22, 33, 44, 55]
  batch_size: 64
  epochs: 100
  patience: 10
  learning_rate: 0.001
  weight_decay: 0.01
  deterministic_algorithms: true
  deterministic_warn_only: false
  point_weight: 1.0
  quantile_weight: 1.0

model:
  hidden_dim: 64
  grid_size: 8
  quantiles: [0.05, 0.5, 0.95]

conformal:
  alpha: 0.10

reliability:
  fusion_weights: [0.5, 0.5]
  min_calibration_coverage: 0.50
  embedding_reference_max: 4096
  error_quantile: 0.90
