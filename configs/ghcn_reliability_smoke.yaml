experiment:
  name: ghcn_reliability_smoke

dataset:
  panel_config: configs/datasets/ghcn_frozen.yaml
  prepared_dir: results/prepared/ghcn_frozen_v1
  frequency: 1D
  station_regions: [north_america_midlatitude, europe]
  # Engineering-only tail subset; never use this configuration for paper results.
  max_observations: 2000

protocols: [within_station, leave_one_region_out]

window:
  history: 14
  horizons: [1]

split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15

training:
  seeds: [11]
  batch_size: 64
  epochs: 1
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.01
  deterministic_algorithms: true
  deterministic_warn_only: false
  point_weight: 1.0
  quantile_weight: 1.0

model:
  hidden_dim: 32
  grid_size: 4
  quantiles: [0.05, 0.5, 0.95]

conformal:
  alpha: 0.10

reliability:
  fusion_weights: [0.5, 0.5]
  min_calibration_coverage: 0.50
  embedding_reference_max: 512
  error_quantile: 0.90
