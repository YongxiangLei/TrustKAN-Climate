# Pre-registered robustness and extreme-subset policy.
# Do not edit these levels after inspecting test rankings.
experiment:
  name: robustness_v1
  model_performance_used: false

noise_scales: [0.05, 0.10, 0.20]
random_missing_rates: [0.10, 0.20, 0.40]
block_missing_lengths:
  daily: [1, 3, 7]
  hourly: [1, 6, 24]

corruption:
  space: train_standardized
  fill_value: 0.0
  seed: 11
  applies_to: test_history_only

extreme:
  lower_quantile: 0.05
  upper_quantile: 0.95
  definition: first_lead
  diagnostic_definition: any_lead
  min_origins: 30
  thresholds_from: training_targets_only
