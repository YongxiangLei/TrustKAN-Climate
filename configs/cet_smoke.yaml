experiment:
  name: cet_smoke

dataset:
  name: CET-Pershore
  source: https://raw.githubusercontent.com/YongxiangLei/kan_proj/d4458e8fb11883b2eec0994aaaa6b7914e7f9e60/cet_mean_station_series.csv
  date_column: date
  target_column: Pershore_College
  frequency: 1D
  min_valid_temperature: -20
  sha256: c54a9da8a66e71368ebf1dde70d8f6d8110d63bb15d39969e34568f5089048f7
  # Engineering-only tail subset; never use this configuration for paper results.
  max_observations: 2000
split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
window:
  history: 365
  horizons: [1]
training:
  batch_size: 64
  epochs: 2
  patience: 2
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.01
  deterministic_algorithms: true
  deterministic_warn_only: false
  seeds: [11]
models: [persistence, svr, random_forest, mlp, lstm, gru, transformer, kan, trustkan]

model_search:
  svr:
    - {c: 1.0, epsilon: 0.1, gamma: scale}
    - {c: 10.0, epsilon: 0.1, gamma: scale}
  random_forest:
    - {n_estimators: 25, max_depth: 8, min_samples_leaf: 1}
    - {n_estimators: 25, max_depth: null, min_samples_leaf: 1}
