# Pilot testing whether widening TrustKAN's receptive field improves accuracy.
#
# The dataset, window, split, and training settings are copied verbatim from
# cet.yaml so the pilot is comparable to the frozen benchmark rather than being
# a separate protocol. Only the model list differs: the two TrustKAN stems and
# the plain KAN that currently beats both, which is the comparison that decides
# whether the wider field is worth a full campaign.
experiment:
  name: cet_stem_pilot

dataset:
  name: CET_Pershore_College
  source: https://raw.githubusercontent.com/YongxiangLei/kan_proj/d4458e8fb11883b2eec0994aaaa6b7914e7f9e60/cet_mean_station_series.csv
  date_column: date
  target_column: Pershore_College
  frequency: 1D
  min_valid_temperature: -20.0
  sha256: c54a9da8a66e71368ebf1dde70d8f6d8110d63bb15d39969e34568f5089048f7

window:
  history: 365
  horizons: [1, 7, 30, 90]

split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15

training:
  seeds: [11, 22, 33, 44, 55]
  batch_size: 64
  epochs: 100
  patience: 10
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.01
  deterministic_algorithms: true
  deterministic_warn_only: false

models:
  - kan
  - trustkan
  - trustkan_dilated
