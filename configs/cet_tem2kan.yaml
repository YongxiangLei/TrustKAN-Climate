experiment:
  name: cet_tem2kan_fair

dataset:
  name: CET-Radcliffe
  source: https://raw.githubusercontent.com/YongxiangLei/kan_proj/d4458e8fb11883b2eec0994aaaa6b7914e7f9e60/cet_mean_station_series.csv
  date_column: date
  target_column: Radcliffe
  frequency: 1D
  min_valid_temperature: -20.0
  sha256: c54a9da8a66e71368ebf1dde70d8f6d8110d63bb15d39969e34568f5089048f7

window:
  history: 300
  horizons: [20]

split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15

training:
  seeds: [11, 22, 33, 44, 55]
  batch_size: 64
  epochs: 200
  patience: 200
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0

models:
  - persistence
  - tem2kan
