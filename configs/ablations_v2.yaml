# Ablations for the v2 architecture.
#
# A0 is now the corrected model, so the trained variants answer a different set
# of questions than they did for the published one. A1 still asks whether the
# KAN mapping earns its place, and it is only now a meaningful question: under
# the local stem the encoder could not matter, because three input steps reached
# it whatever it was. A10 and A11 remove the two architectural changes
# separately, so each is charged for its own contribution rather than the pair
# being credited as one.
#
# A9 keeps the superseded mean-pooled readout reproducible. A3-A8 remain
# evaluation-side recomputations from the A0 artifact.
experiment:
  name: ablations_cet_v2

dataset:
  name: CET_Pershore_College
  source: https://raw.githubusercontent.com/YongxiangLei/kan_proj/d4458e8fb11883b2eec0994aaaa6b7914e7f9e60/cet_mean_station_series.csv
  date_column: date
  target_column: Pershore_College
  frequency: 1D
  min_valid_temperature: -20.0
  sha256: c54a9da8a66e71368ebf1dde70d8f6d8110d63bb15d39969e34568f5089048f7

window:
  history: 365
  horizons: [1, 7, 30, 90]

split:
  train: 0.60
  validation: 0.15
  calibration: 0.10
  test: 0.15

training:
  seeds: [11, 22, 33, 44, 55]
  batch_size: 64
  epochs: 100
  patience: 10
  learning_rate: 0.001
  weight_decay: 0.01
  deterministic_algorithms: true
  deterministic_warn_only: false
  point_weight: 1.0
  quantile_weight: 1.0

model:
  hidden_dim: 64
  grid_size: 8
  quantiles: [0.05, 0.5, 0.95]
  stem: dilated
  readout: attention

conformal:
  alpha: 0.10

reliability:
  fusion_weights: [0.5, 0.5]
  weight_selection: calibration
  min_calibration_coverage: 0.50
  embedding_reference_max: 4096
  error_quantile: 0.90

variants:
  - id: A0
    label: Full TrustKAN v2
    encoder: kan
    quantile_head: true
  - id: A1
    label: Budget-matched non-KAN encoder
    encoder: mlp
    quantile_head: true
  - id: A2
    label: No quantile head
    encoder: kan
    quantile_head: false
    quantile_weight: 0.0
  - id: A9
    label: Mean-pooled readout instead of attention
    encoder: kan
    quantile_head: true
    readout: mean
  - id: A10
    label: Local stem, so the field spans three steps
    encoder: kan
    quantile_head: true
    stem: local
  - id: A11
    label: Last-state readout instead of attention
    encoder: kan
    quantile_head: true
    readout: last

adaptive:
  gamma: 0.01
  window: 256
  coverage_window: 100
